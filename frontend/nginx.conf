server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests directly to the deployed Cloud Run backend
    location /api/ {
        proxy_pass https://clipsense-backend-962363545501.us-central1.run.app/api/;
        proxy_http_version 1.1;
        proxy_set_header Host clipsense-backend-962363545501.us-central1.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}